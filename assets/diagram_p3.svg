<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto" style="background:#fff;font-family:'Sarabun',sans-serif;">
  <rect x="0" y="0" width="800" height="300" fill="#fff" stroke="#CBD5E1"/>
  <text x="20" y="30" fill="#14295B" font-size="16" font-weight="700">ตัวอย่างที่ 5.5: เพลาเหล็ก ABCD หุ้มด้วยอะลูมิเนียมช่วง BC (T = 20 N·m)</text>
  <!-- Shaft -->
  <text x="45" y="125" fill="#B3201F" font-size="13" font-weight="700">A: 20 N·m</text>
  <rect x="110" y="112" width="100" height="16" fill="#DBEAFE" stroke="#1C2FA8" stroke-width="2"/>
  <rect x="210" y="95" width="160" height="50" fill="#FEE2E2" stroke="#B3201F" stroke-width="2"/>
  <rect x="210" y="112" width="160" height="16" fill="#DBEAFE" stroke="#1C2FA8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="370" y="112" width="100" height="16" fill="#DBEAFE" stroke="#1C2FA8" stroke-width="2"/>
  <line x1="470" y1="80" x2="470" y2="160" stroke="#16181D" stroke-width="4"/>
  <text x="480" y="125" fill="#16181D" font-size="13" font-weight="700">D (ยึดแน่น)</text>
  <text x="160" y="170" fill="#64748B" font-size="12" text-anchor="middle">AB = 0.4 m</text>
  <text x="290" y="170" fill="#B3201F" font-size="12" font-weight="700" text-anchor="middle">BC = 0.6 m (หุ้ม Al)</text>
  <text x="420" y="170" fill="#64748B" font-size="12" text-anchor="middle">CD = 0.4 m</text>
  <!-- Cross Section BC -->
  <circle cx="640" cy="120" r="52" fill="#FEE2E2" stroke="#B3201F" stroke-width="2"/>
  <circle cx="640" cy="120" r="18" fill="#DBEAFE" stroke="#1C2FA8" stroke-width="2"/>
  <text x="640" y="55" fill="#14295B" font-size="12" font-weight="700" text-anchor="middle">แกนเหล็ก d=10 | ปลอก Al d_o=30</text>
  <!-- Summary -->
  <rect x="20" y="195" width="760" height="85" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="35" y="218" fill="#14295B" font-size="13" font-weight="700">ความเข้ากันได้ช่วง BC: φ_a = φ_s  ⇒  T_a = 36 T_s  ⇒  T_s = 0.54 N·m,  T_a = 19.46 N·m</text>
  <text x="35" y="240" fill="#1C2FA8" font-size="13" font-weight="700">เหล็ก: ช่วง AB, CD = 101.86 MPa | ช่วง BC = 2.75 MPa</text>
  <text x="35" y="262" fill="#B3201F" font-size="13" font-weight="700">อะลูมิเนียมช่วง BC: τ_min = 1.24 MPa, τ_max = 3.72 MPa  |  มุมบิดปลาย A = 0.20785 rad</text>
</svg>