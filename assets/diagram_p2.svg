<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto" style="background:#fff;font-family:'Sarabun',sans-serif;">
  <rect x="0" y="0" width="800" height="300" fill="#fff" stroke="#CBD5E1"/>
  <text x="20" y="30" fill="#14295B" font-size="16" font-weight="700">ตัวอย่างที่ 5.4: เพลาวงแหวน ABCD ยึดแน่นปลาย A และ D (d_o = 20 mm, d_i = 10 mm)</text>
  <!-- Left: Beam/Shaft layout -->
  <line x1="60" y1="80" x2="60" y2="160" stroke="#16181D" stroke-width="4"/>
  <text x="40" y="125" fill="#16181D" font-size="14" font-weight="700">A</text>
  <rect x="60" y="108" width="420" height="24" fill="#F1F5F9" stroke="#14295B" stroke-width="2"/>
  <line x1="60" y1="120" x2="480" y2="120" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <line x1="480" y1="80" x2="480" y2="160" stroke="#16181D" stroke-width="4"/>
  <text x="492" y="125" fill="#16181D" font-size="14" font-weight="700">D</text>
  <!-- Torques B and C -->
  <ellipse cx="220" cy="120" rx="8" ry="38" fill="#DBEAFE" stroke="#1C2FA8" stroke-width="2"/>
  <text x="200" y="72" fill="#1C2FA8" font-size="13" font-weight="700">B: 800 N·m</text>
  <ellipse cx="340" cy="120" rx="8" ry="38" fill="#FEE2E2" stroke="#B3201F" stroke-width="2"/>
  <text x="320" y="72" fill="#B3201F" font-size="13" font-weight="700">C: 1200 N·m</text>
  <!-- Lengths -->
  <text x="140" y="175" fill="#64748B" font-size="12" text-anchor="middle">600 mm</text>
  <text x="280" y="175" fill="#64748B" font-size="12" text-anchor="middle">400 mm</text>
  <text x="410" y="175" fill="#64748B" font-size="12" text-anchor="middle">500 mm</text>
  <!-- Right: Hollow Cross-section & Stress -->
  <circle cx="640" cy="125" r="55" fill="#FEE2E2" stroke="#B3201F" stroke-width="2"/>
  <circle cx="640" cy="125" r="27" fill="#FFFFFF" stroke="#14295B" stroke-width="2"/>
  <text x="640" y="60" fill="#B3201F" font-size="13" font-weight="700" text-anchor="middle">c_o = 10 mm, c_i = 5 mm</text>
  <text x="705" y="110" fill="#B3201F" font-size="12" font-weight="700">τ_max (r=10)</text>
  <text x="705" y="130" fill="#14295B" font-size="12" font-weight="700">τ_min (r=5) ≠ 0 !</text>
  <!-- Summary Footer -->
  <rect x="20" y="205" width="760" height="75" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="35" y="228" fill="#14295B" font-size="13" font-weight="700">สมการเข้ากันได้: φ_AB + φ_BC + φ_CD = 0  ⇒  T_BC = -720 N·m (พุ่งเข้า), T_AB = 80 N·m, T_CD = 480 N·m</text>
  <text x="35" y="250" fill="#B3201F" font-size="13" font-weight="700">ช่วงวิกฤต BC: τ_max = 488.93 MPa (ที่ผิวนอก 10 mm)  |  τ_min = 244.47 MPa (ที่ผิวใน 5 mm)</text>
  <text x="35" y="270" fill="#64748B" font-size="12">ช่วง AB: 27.16 ≤ τ_AB ≤ 54.33 MPa  |  ช่วง CD: 162.98 ≤ τ_CD ≤ 325.95 MPa</text>
</svg>