<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto" style="background:#fff;font-family:'Sarabun',sans-serif;">
  <rect x="0" y="0" width="800" height="360" fill="#fff" stroke="#CBD5E1"/>
  <text x="20" y="28" fill="#14295B" font-size="15" font-weight="700">ตัวอย่างที่ 6.2: คานตัว T ยื่น 1 m รับแรงกระจาย 20 kN/m พร้อม SFD (+15 → -25 → +20 → 0) &amp; BMD</text>
  <!-- Beam Loading -->
  <rect x="60" y="65" width="300" height="12" fill="#E2E8F0" stroke="#14295B" stroke-width="2"/>
  <!-- UDL arrows -->
  <line x1="60" y1="45" x2="360" y2="45" stroke="#B3201F" stroke-width="2"/>
  <text x="210" y="40" fill="#B3201F" font-size="12" font-weight="700" text-anchor="middle">w = 20 kN/m (รวม 60 kN)</text>
  <polygon points="60,77 53,90 67,90" fill="#16181D"/>
  <text x="40" y="102" fill="#14295B" font-size="12" font-weight="700">R_A = 15 kN</text>
  <circle cx="260" cy="83" r="6" fill="#fff" stroke="#16181D" stroke-width="2"/>
  <text x="235" y="104" fill="#14295B" font-size="12" font-weight="700">R_B = 45 kN</text>
  <text x="160" y="98" fill="#64748B" font-size="11">2 m</text>
  <text x="310" y="98" fill="#64748B" font-size="11">1 m</text>

  <!-- SFD Diagram -->
  <line x1="60" y1="160" x2="360" y2="160" stroke="#16181D" stroke-width="1.5"/>
  <polygon points="60,160 60,135 135,160" fill="#DBEAFE" stroke="#1C2FA8" stroke-width="2"/>
  <polygon points="135,160 260,200 260,160" fill="#FEE2E2" stroke="#B3201F" stroke-width="2"/>
  <polygon points="260,160 260,128 360,160" fill="#DBEAFE" stroke="#1C2FA8" stroke-width="2"/>
  <text x="65" y="132" fill="#1C2FA8" font-size="12" font-weight="700">+15</text>
  <text x="135" y="174" fill="#16181D" font-size="11" text-anchor="middle">x=0.75m</text>
  <text x="245" y="214" fill="#B3201F" font-size="12" font-weight="700">-25</text>
  <text x="265" y="124" fill="#1C2FA8" font-size="12" font-weight="700">+20</text>
  <text x="365" y="164" fill="#64748B" font-size="12" font-weight="700">SFD</text>

  <!-- BMD Diagram -->
  <line x1="60" y1="275" x2="360" y2="275" stroke="#16181D" stroke-width="1.5"/>
  <path d="M 60 275 Q 135 215 215 275 Q 245 298 260 310 L 360 275" fill="none" stroke="#17702A" stroke-width="2.5"/>
  <text x="135" y="242" fill="#17702A" font-size="12" font-weight="700" text-anchor="middle">+5.625 kN·m</text>
  <text x="260" y="326" fill="#B3201F" font-size="12" font-weight="700" text-anchor="middle">-10 kN·m</text>
  <text x="365" y="280" fill="#64748B" font-size="12" font-weight="700">BMD</text>

  <!-- Right: T-Section & Stress Summary -->
  <rect x="440" y="45" width="340" height="295" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <!-- T-shape -->
  <rect x="520" y="65" width="120" height="16" fill="#FEE2E2" stroke="#B3201F" stroke-width="2"/>
  <rect x="572" y="81" width="16" height="120" fill="#F3E8FF" stroke="#14295B" stroke-width="2"/>
  <line x1="485" y1="120" x2="675" y2="120" stroke="#1C2FA8" stroke-dasharray="6 3" stroke-width="1.5"/>
  <text x="680" y="124" fill="#1C2FA8" font-size="12" font-weight="700">NA</text>
  <text x="460" y="95" fill="#16181D" font-size="11">48 mm</text>
  <text x="460" y="165" fill="#16181D" font-size="11">d=82 mm</text>
  <text x="580" y="228" fill="#14295B" font-size="13" font-weight="700" text-anchor="middle">I = 3,135,200 mm⁴</text>
  <text x="455" y="255" fill="#17702A" font-size="13" font-weight="700">• ที่ M_A = +5.625: อัดบน 86.1, ดึงล่าง 147.1 MPa</text>
  <text x="455" y="278" fill="#B3201F" font-size="13" font-weight="700">• ที่ M_B = -10.00: ดึงบน 153.1, อัดล่าง 261.5 MPa</text>
  <text x="455" y="302" fill="#64748B" font-size="12">ค่าความเค้นดัดสูงสุด: อัด 261.5 MPa | ดึง 153.1 MPa</text>
  <text x="455" y="322" fill="#1C2FA8" font-size="12">ตย. 6.1 (I-beam): σ_max = 214.7 MPa, ปีกรับ 77.9%</text>
</svg>