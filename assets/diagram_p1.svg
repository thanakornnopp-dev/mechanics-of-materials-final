<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="auto" style="background:#fff;font-family:'Sarabun',sans-serif;">
  <rect x="0" y="0" width="800" height="320" fill="#fff" stroke="#CBD5E1"/>
  <text x="20" y="30" fill="#14295B" font-size="16" font-weight="700">ตัวอย่างที่ 5.1: เพลา ABC ยึดแน่นที่ A (d = 40 mm) &amp; ตัวอย่างที่ 5.2: เฟือง A-B</text>
  
  <!-- Left: Ex 5.1 -->
  <rect x="20" y="45" width="370" height="255" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="35" y="68" fill="#14295B" font-size="14" font-weight="700">ตย. 5.1: เพลา ABC (G = 80 GPa, c = 20 mm)</text>
  <!-- Fixed Wall A -->
  <line x1="60" y1="100" x2="60" y2="180" stroke="#16181D" stroke-width="4"/>
  <line x1="50" y1="110" x2="60" y2="100" stroke="#16181D" stroke-width="1.5"/>
  <line x1="50" y1="125" x2="60" y2="115" stroke="#16181D" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="60" y2="130" stroke="#16181D" stroke-width="1.5"/>
  <line x1="50" y1="155" x2="60" y2="145" stroke="#16181D" stroke-width="1.5"/>
  <line x1="50" y1="170" x2="60" y2="160" stroke="#16181D" stroke-width="1.5"/>
  <text x="42" y="145" fill="#16181D" font-size="13" font-weight="700">A</text>
  <!-- Shaft -->
  <rect x="60" y="130" width="270" height="20" fill="#E2E8F0" stroke="#14295B" stroke-width="2"/>
  <!-- Gears B and C -->
  <ellipse cx="210" cy="140" rx="8" ry="38" fill="#FEE2E2" stroke="#B3201F" stroke-width="2"/>
  <text x="205" y="95" fill="#B3201F" font-size="13" font-weight="700">B: 800 N·m</text>
  <ellipse cx="330" cy="140" rx="8" ry="38" fill="#DCFCE7" stroke="#17702A" stroke-width="2"/>
  <text x="305" y="95" fill="#17702A" font-size="13" font-weight="700">C: 1200 N·m</text>
  <!-- Lengths -->
  <line x1="60" y1="195" x2="210" y2="195" stroke="#64748B" stroke-width="1.5"/>
  <text x="135" y="212" fill="#64748B" font-size="12" text-anchor="middle">L_AB = 600 mm</text>
  <line x1="210" y1="195" x2="330" y2="195" stroke="#64748B" stroke-width="1.5"/>
  <text x="270" y="212" fill="#64748B" font-size="12" text-anchor="middle">L_BC = 400 mm</text>
  <!-- Results Box -->
  <text x="35" y="242" fill="#14295B" font-size="13" font-weight="700">• T_AB = 400 N·m → τ_AB = 31.8 MPa</text>
  <text x="35" y="262" fill="#B3201F" font-size="13" font-weight="700">• T_BC = 1200 N·m → τ_BC = 95.5 MPa</text>
  <text x="35" y="282" fill="#17702A" font-size="13" font-weight="700">• φ_B = 0.01194 rad, φ_C = 0.03581 rad</text>

  <!-- Right: Ex 5.2 -->
  <rect x="410" y="45" width="370" height="255" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="425" y="68" fill="#14295B" font-size="14" font-weight="700">ตย. 5.2: เฟือง A (r=200) ขบเฟือง B (r=100)</text>
  <!-- Gear A -->
  <circle cx="510" cy="145" r="40" fill="#DBEAFE" stroke="#1C2FA8" stroke-width="2"/>
  <text x="495" y="150" fill="#1C2FA8" font-size="13" font-weight="700">A (r=200)</text>
  <text x="470" y="98" fill="#B3201F" font-size="12" font-weight="700">T_A = 80 N·m</text>
  <!-- Gear B + Shaft BC -->
  <circle cx="575" cy="145" r="25" fill="#FEE2E2" stroke="#B3201F" stroke-width="2"/>
  <text x="562" y="150" fill="#B3201F" font-size="12" font-weight="700">B</text>
  <rect x="600" y="138" width="120" height="14" fill="#E2E8F0" stroke="#14295B" stroke-width="2"/>
  <line x1="720" y1="115" x2="720" y2="175" stroke="#16181D" stroke-width="4"/>
  <text x="730" y="150" fill="#16181D" font-size="13" font-weight="700">C (ยึด)</text>
  <text x="660" y="175" fill="#64748B" font-size="12" text-anchor="middle">L_BC = 400 mm (d = 20 mm)</text>
  <!-- Results Box -->
  <text x="425" y="222" fill="#14295B" font-size="13" font-weight="700">• แรงขบฟันเฟือง F = 80 / 0.2 = 400 N</text>
  <text x="425" y="242" fill="#B3201F" font-size="13" font-weight="700">• T_BC = 400(0.1) = 40 N·m → τ_BC = 25.46 MPa</text>
  <text x="425" y="262" fill="#17702A" font-size="13" font-weight="700">• φ_B = 0.01273 rad, φ_A = 0.5 φ_B = 0.00637 rad</text>
</svg>